            Widget _buildHistoricoAba() {
              final query = _buscaReciboController.text.toLowerCase();
              final filtrados = _recibosSalvos.where((r) {
                final nome = (r['pagador'] ?? '').toString().toLowerCase();
                final num = (r['numero'] ?? '').toString().toLowerCase();
                return nome.contains(query) || num.contains(query);
              }).toList();

              return Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.all(12),
                    child: TextField(
                      controller: _buscaReciboController,
                      decoration: InputDecoration(
                        hintText: 'Pesquisar por cliente ou nº do recibo...',
                        prefixIcon: const Icon(Icons.search),
                        suffixIcon: _buscaReciboController.text.isNotEmpty
                            ? IconButton(
                                icon: const Icon(Icons.clear),
                                onPressed: () {
                                  _buscaReciboController.clear();
                                  setState(() {});
                                },
                              )
                            : null,
                      ),
                      onChanged: (_) => setState(() {}),
                    ),
                  ),
                  Expanded(
                    child: filtrados.isEmpty
                        ? const Center(child: Text("Nenhum recibo arquivado.", style: TextStyle(color: Colors.grey)))
                        : ListView.builder(
                            padding: const EdgeInsets.symmetric(horizontal: 12),
                            itemCount: filtrados.length,
                            itemBuilder: (context, index) {
                              final r = filtrados[index];
                              final realIndex = _recibosSalvos.indexOf(r);
                              return Card(
                                margin: const EdgeInsets.only(bottom: 10),
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                child: Padding(
                                  padding: const EdgeInsets.all(12),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text("Nº ${r['numero']} • ${r['data']}",
                                              style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.indigo)),
                                          Text("R\$ ${r['valor']}",
                                              style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.green)),
                                        ],
                                      ),
                                      const SizedBox(height: 4),
                                      Text("Cliente: ${r['pagador']}", style: const TextStyle(fontWeight: FontWeight.w600)),
                                      Text("Referente: ${r['referente']}", maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12, color: Colors.grey)),
                                      const Divider(height: 16),
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.end,
                                        children: [
                                          TextButton.icon(
                                            icon: const Icon(Icons.print_outlined, size: 18, color: Colors.indigo),
                                            label: const Text("Imprimir 2ª Via", style: TextStyle(color: Colors.indigo)),
                                            onPressed: () => _imprimirSegundaVia(r),
                                          ),
                                          IconButton(
                                            icon: const Icon(Icons.edit_note, color: Colors.amber),
                                            tooltip: 'Editar Recibo',
                                            onPressed: () => _carregarReciboParaEdicao(realIndex),
                                          ),
                                          IconButton(
                                            icon: const Icon(Icons.delete_outline, color: Colors.red),
                                            tooltip: 'Excluir',
                                            onPressed: () async {
                                              final prefs = await SharedPreferences.getInstance();
                                              _recibosSalvos.removeAt(realIndex);
                                              await prefs.setString('historico_recibos', jsonEncode(_recibosSalvos));
                                              setState(() {});
                                            },
                                          ),
                                        ],
                                      ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                  ),
                ],
              );
            }

