name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Criar base nativa Android
        run: |
          flutter create --project-name recibo_pro --platforms=android --org com.recibo.pro .

      - name: Ajustar Android compileSdk 35, Kotlin e AAPT2
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle || true
          echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

      - name: Escrever pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: recibo_pro
          description: "Sistema Avancado de Recibos Digitais Material You"
          publish_to: 'none'
          version: 2.5.0+7

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            pdf: ^3.10.8
            printing: ^5.13.1
            intl: ^0.19.0
            signature: ^5.4.1
            shared_preferences: ^2.2.3
            image_picker: ^1.1.2
            url_launcher: ^6.3.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Escrever lib/pdf_generator.dart
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/pdf_generator.dart
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';

          class PdfGenerator {
            static Future<void> gerarECompartilhar({
              required BuildContext context,
              required String numeroRecibo,
              required String emitente,
              required String documentoEmitente,
              required String pagador,
              required String documentoPagador,
              required String valor,
              required String referente,
              required String data,
              required String operador,
              Uint8List? signatureBytes,
              Uint8List? logoBytes,
              bool apenasSegundaVia = false,
            }) async {
              final pdf = pw.Document();

              final darkNavy = PdfColor.fromHex('0F172A');
              final accentEmerald = PdfColor.fromHex('007A4D');
              final lightBg = PdfColor.fromHex('F8FAFC');

              pw.Widget buildViaBlock(String tagVia, {bool isReemissao = false}) {
                return pw.Container(
                  padding: const pw.EdgeInsets.all(14),
                  decoration: pw.BoxDecoration(
                    border: pw.Border.all(color: darkNavy, width: 1.2),
                    borderRadius: const pw.BorderRadius.all(pw.Radius.circular(10)),
                    color: PdfColors.white,
                  ),
                  child: pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    mainAxisSize: pw.MainAxisSize.min,
                    children: [
                      pw.Row(
                        crossAxisAlignment: pw.CrossAxisAlignment.center,
                        children: [
                          if (logoBytes != null)
                            pw.Container(
                              width: 48,
                              height: 48,
                              margin: const pw.EdgeInsets.only(right: 12),
                              child: pw.Image(pw.MemoryImage(logoBytes), fit: pw.BoxFit.contain),
                            ),
                          pw.Expanded(
                            child: pw.Column(
                              crossAxisAlignment: pw.CrossAxisAlignment.start,
                              children: [
                                pw.Text(
                                  emitente.isNotEmpty ? emitente.toUpperCase() : "RECIBO DE PAGAMENTO",
                                  style: pw.TextStyle(
                                    fontSize: 13,
                                    fontWeight: pw.FontWeight.bold,
                                    color: darkNavy,
                                  ),
                                ),
                                if (documentoEmitente.isNotEmpty)
                                  pw.Text("CNPJ/CPF: $documentoEmitente",
                                      style: const pw.TextStyle(fontSize: 8.5, color: PdfColors.grey700)),
                                pw.SizedBox(height: 2),
                                pw.Row(
                                  children: [
                                    pw.Text("RECIBO Nº: $numeroRecibo",
                                        style: pw.TextStyle(fontSize: 9.5, fontWeight: pw.FontWeight.bold, color: darkNavy)),
                                    pw.SizedBox(width: 8),
                                    pw.Container(
                                      padding: const pw.EdgeInsets.symmetric(horizontal: 6, vertical: 1.5),
                                      decoration: pw.BoxDecoration(
                                        color: isReemissao ? PdfColors.amber50 : lightBg,
                                        borderRadius: const pw.BorderRadius.all(pw.Radius.circular(4)),
                                        border: pw.Border.all(color: isReemissao ? PdfColors.amber800 : darkNavy, width: 0.6),
                                      ),
                                      child: pw.Text(
                                        tagVia,
                                        style: pw.TextStyle(
                                          fontSize: 7.5,
                                          fontWeight: pw.FontWeight.bold,
                                          color: isReemissao ? PdfColors.amber900 : darkNavy,
                                        ),
                                      ),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                          ),
                          pw.Container(
                            padding: const pw.EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                            decoration: pw.BoxDecoration(
                              color: lightBg,
                              border: pw.Border.all(color: darkNavy, width: 1),
                              borderRadius: const pw.BorderRadius.all(pw.Radius.circular(8)),
                            ),
                            child: pw.Column(
                              crossAxisAlignment: pw.CrossAxisAlignment.end,
                              children: [
                                pw.Text("VALOR TOTAL", style: const pw.TextStyle(fontSize: 7, color: PdfColors.grey700)),
                                pw.Text(
                                  "R\$ $valor",
                                  style: pw.TextStyle(
                                    fontSize: 15,
                                    fontWeight: pw.FontWeight.bold,
                                    color: accentEmerald,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
                      pw.Divider(thickness: 0.8, height: 14),
                      pw.RichText(
                        text: pw.TextSpan(
                          style: const pw.TextStyle(fontSize: 9.5, lineSpacing: 1.3),
                          children: [
                            const pw.TextSpan(text: "Recebemos de "),
                            pw.TextSpan(text: pagador, style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                            const pw.TextSpan(text: ", portador do CPF/CNPJ nº "),
                            pw.TextSpan(text: documentoPagador, style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                            const pw.TextSpan(text: ", a quantia líquida de "),
                            pw.TextSpan(text: "R\$ $valor", style: pw.TextStyle(fontWeight: pw.FontWeight.bold, color: accentEmerald)),
                            const pw.TextSpan(text: " referente aos serviços / produtos discriminados abaixo."),
                          ],
                        ),
                      ),
                      pw.SizedBox(height: 6),
                      pw.Container(
                        width: double.infinity,
                        padding: const pw.EdgeInsets.all(8),
                        decoration: pw.BoxDecoration(
                          color: lightBg,
                          border: pw.Border.all(color: PdfColors.grey300, width: 0.5),
                          borderRadius: const pw.BorderRadius.all(pw.Radius.circular(6)),
                        ),
                        child: pw.Text(
                          "Referente a: $referente",
                          style: const pw.TextStyle(fontSize: 9, color: PdfColors.black),
                        ),
                      ),
                      pw.SizedBox(height: 6),
                      pw.Text(
                        "Para os devidos fins de direito, firmamos o presente recibo dando plena quitação.",
                        style: const pw.TextStyle(fontSize: 7.5, color: PdfColors.grey700),
                      ),
                      pw.SizedBox(height: 10),
                      pw.Row(
                        mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                        crossAxisAlignment: pw.CrossAxisAlignment.end,
                        children: [
                          pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.start,
                            children: [
                              pw.Text("Emissão: $data", style: const pw.TextStyle(fontSize: 8.5)),
                              if (operador.isNotEmpty)
                                pw.Text("Operador: $operador", style: const pw.TextStyle(fontSize: 8, color: PdfColors.grey800)),
                            ],
                          ),
                          pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.center,
                            children: [
                              if (signatureBytes != null)
                                pw.Container(
                                  height: 36,
                                  width: 130,
                                  child: pw.Image(pw.MemoryImage(signatureBytes), fit: pw.BoxFit.contain),
                                )
                              else
                                pw.SizedBox(height: 36),
                              pw.Container(
                                width: 160,
                                decoration: const pw.BoxDecoration(
                                  border: pw.Border(bottom: pw.BorderSide(color: PdfColors.black, width: 0.8)),
                                ),
                              ),
                              pw.SizedBox(height: 2),
                              pw.Text("Assinatura do Emitente", style: const pw.TextStyle(fontSize: 7.5)),
                            ],
                          ),
                        ],
                      ),
                    ],
                  ),
                );
              }

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.symmetric(horizontal: 24, vertical: 20),
                  build: (pw.Context context) {
                    if (apenasSegundaVia) {
                      return pw.Column(
                        children: [
                          buildViaBlock("2ª VIA - EMPRESA (REEMISSÃO)", isReemissao: true),
                          pw.Padding(
                            padding: const pw.EdgeInsets.symmetric(vertical: 12),
                            child: pw.Text("--- 2ª VIA ARQUIVADA ---", style: const pw.TextStyle(fontSize: 8, color: PdfColors.grey600)),
                          ),
                          buildViaBlock("2ª VIA - CLIENTE (REEMISSÃO)", isReemissao: true),
                        ],
                      );
                    }

                    return pw.Column(
                      children: [
                        buildViaBlock("1ª VIA - CLIENTE"),
                        pw.Padding(
                          padding: const pw.EdgeInsets.symmetric(vertical: 14),
                          child: pw.Row(
                            mainAxisAlignment: pw.MainAxisAlignment.center,
                            children: [
                              pw.Text(
                                "- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -",
                                style: const pw.TextStyle(color: PdfColors.grey500, fontSize: 6),
                              ),
                            ],
                          ),
                        ),
                        buildViaBlock("2ª VIA - EMPRESA"),
                      ],
                    );
                  },
                ),
              );

              await Printing.layoutPdf(
                onLayout: (PdfPageFormat format) async => pdf.save(),
                name: 'recibo_${numeroRecibo}_${apenasSegundaVia ? "2via" : "completo"}.pdf',
              );
            }
          }
          EOF

      - name: Escrever lib/main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:intl/intl.dart';
          import 'package:signature/signature.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'pdf_generator.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.dark,
              ),
            );
            runApp(const ReciboProApp());
          }

          class M3Colors {
            static const primaryDark = Color(0xFF0F172A);
            static const primaryAccent = Color(0xFF0F52BA);
            static const emerald = Color(0xFF00A86B);
            static const emeraldGlow = Color(0xFF4ADE80);
            static const emeraldSoft = Color(0xFFE6FAF0);
            static const surface = Color(0xFFF4F6FA);
            static const card = Color(0xFFFFFFFF);
            static const outline = Color(0xFFE2E8F0);
            static const textMain = Color(0xFF0F172A);
            static const textMuted = Color(0xFF64748B);
            static const error = Color(0xFFDC2626);
          }

          class ReciboProApp extends StatelessWidget {
            const ReciboProApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Recibo Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: M3Colors.surface,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: M3Colors.primaryDark,
                    primary: M3Colors.primaryDark,
                    surface: M3Colors.surface,
                    outline: M3Colors.outline,
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: M3Colors.surface,
                    foregroundColor: M3Colors.textMain,
                    centerTitle: false,
                    elevation: 0,
                    scrolledUnderElevation: 0,
                    titleTextStyle: TextStyle(
                      color: M3Colors.textMain,
                      fontSize: 22,
                      fontWeight: FontWeight.w900,
                      letterSpacing: -0.5,
                    ),
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: M3Colors.card,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(16),
                      borderSide: const BorderSide(color: M3Colors.outline, width: 1.2),
                    ),
                    enabledBorder: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(16),
                      borderSide: const BorderSide(color: M3Colors.outline, width: 1.2),
                    ),
                    focusedBorder: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(16),
                      borderSide: const BorderSide(color: M3Colors.primaryDark, width: 2),
                    ),
                    contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 16),
                    labelStyle: const TextStyle(color: M3Colors.textMuted, fontSize: 13),
                    prefixIconColor: M3Colors.primaryDark,
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int _currentIndex = 0;
            final _formKey = GlobalKey<FormState>();

            final _operadorController = TextEditingController();
            final _emitenteController = TextEditingController();
            final _docEmitenteController = TextEditingController();
            final _pagadorController = TextEditingController();
            final _docPagadorController = TextEditingController();
            final _valorController = TextEditingController();
            final _referenteController = TextEditingController();

            final _buscaReciboController = TextEditingController();
            final _buscaClienteController = TextEditingController();

            late SignatureController _signatureController;
            String _dataAtual = '';
            int _numeroSequencial = 1;
            Uint8List? _logoBytes;
            bool _hasSignature = false;

            List<Map<String, dynamic>> _recibosSalvos = [];
            List<Map<String, dynamic>> _clientesSalvos = [];
            int? _editingReciboIndex;

            final List<String> _atalhos = [
              'Mão de Obra',
              'Prestação de Serviços',
              'Suporte Técnico TI',
              'Manutenção',
              'Adiantamento',
              'Consultoria',
            ];

            @override
            void initState() {
              super.initState();
              _dataAtual = DateFormat('dd/MM/yyyy').format(DateTime.now());
              _signatureController = SignatureController(
                penStrokeWidth: 3.2,
                penColor: M3Colors.primaryDark,
                exportBackgroundColor: Colors.transparent,
              );
              _signatureController.addListener(() {
                final notEmpty = _signatureController.isNotEmpty;
                if (notEmpty != _hasSignature) {
                  setState(() => _hasSignature = notEmpty);
                }
              });
              _carregarConfiguracoes();
              _carregarRecibos();
              _carregarClientes();
            }

            @override
            void dispose() {
              _signatureController.dispose();
              super.dispose();
            }

            Future<void> _carregarConfiguracoes() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _operadorController.text = prefs.getString('ultimo_operador') ?? '';
                _emitenteController.text = prefs.getString('empresa_nome') ?? '';
                _docEmitenteController.text = prefs.getString('empresa_doc') ?? '';
                _numeroSequencial = prefs.getInt('recibo_sequencial') ?? 1;
                final logoBase64 = prefs.getString('empresa_logo');
                if (logoBase64 != null) {
                  _logoBytes = base64Decode(logoBase64);
                }
              });
            }

            Future<void> _salvarConfiguracoes() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('ultimo_operador', _operadorController.text);
              await prefs.setString('empresa_nome', _emitenteController.text);
              await prefs.setString('empresa_doc', _docEmitenteController.text);
              await prefs.setInt('recibo_sequencial', _numeroSequencial);
              if (_logoBytes != null) {
                await prefs.setString('empresa_logo', base64Encode(_logoBytes!));
              }
            }

            Future<void> _selecionarLogo() async {
              final picker = ImagePicker();
              final picked = await picker.pickImage(source: ImageSource.gallery);
              if (picked != null) {
                final bytes = await picked.readAsBytes();
                setState(() => _logoBytes = bytes);
                _salvarConfiguracoes();
              }
            }

            Future<void> _carregarRecibos() async {
              final prefs = await SharedPreferences.getInstance();
              final raw = prefs.getString('historico_recibos');
              if (raw != null) {
                final List decoded = jsonDecode(raw);
                setState(() => _recibosSalvos = decoded.cast<Map<String, dynamic>>());
              }
            }

            Future<void> _carregarClientes() async {
              final prefs = await SharedPreferences.getInstance();
              final raw = prefs.getString('lista_clientes');
              if (raw != null) {
                final List decoded = jsonDecode(raw);
                setState(() {
                  _clientesSalvos = decoded.cast<Map<String, dynamic>>();
                  _ordenarClientes();
                });
              }
            }

            void _ordenarClientes() {
              _clientesSalvos.sort((a, b) => (a['nome'] as String).toLowerCase().compareTo((b['nome'] as String).toLowerCase()));
            }

            Future<void> _salvarClientes() async {
              final prefs = await SharedPreferences.getInstance();
              _ordenarClientes();
              await prefs.setString('lista_clientes', jsonEncode(_clientesSalvos));
              setState(() {});
            }

            Future<void> _emitirRecibo() async {
              if (_formKey.currentState!.validate()) {
                HapticFeedback.mediumImpact();
                if (_operadorController.text.trim().isEmpty) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      behavior: SnackBarBehavior.floating,
                      content: Text('Informe o Nome do Operador / Emitente!'),
                      backgroundColor: M3Colors.error,
                    ),
                  );
                  return;
                }

                Uint8List? signatureBytes;
                if (_signatureController.isNotEmpty) {
                  signatureBytes = await _signatureController.toPngBytes();
                }

                final numeroFormatado = _editingReciboIndex != null
                    ? _recibosSalvos[_editingReciboIndex!]['numero']
                    : _numeroSequencial.toString().padLeft(4, '0');

                final dadosRecibo = {
                  'numero': numeroFormatado,
                  'data': _dataAtual,
                  'operador': _operadorController.text.trim(),
                  'emitente': _emitenteController.text.trim(),
                  'docEmitente': _docEmitenteController.text.trim(),
                  'pagador': _pagadorController.text.trim(),
                  'docPagador': _docPagadorController.text.trim(),
                  'valor': _valorController.text.trim(),
                  'referente': _referenteController.text.trim(),
                  'assinatura': signatureBytes != null ? base64Encode(signatureBytes) : null,
                };

                final prefs = await SharedPreferences.getInstance();
                if (_editingReciboIndex != null) {
                  _recibosSalvos[_editingReciboIndex!] = dadosRecibo;
                  _editingReciboIndex = null;
                } else {
                  _recibosSalvos.insert(0, dadosRecibo);
                  _numeroSequencial++;
                  await prefs.setInt('recibo_sequencial', _numeroSequencial);
                }

                await prefs.setString('historico_recibos', jsonEncode(_recibosSalvos));
                await _salvarConfiguracoes();

                if (!mounted) return;

                await PdfGenerator.gerarECompartilhar(
                  context: context,
                  numeroRecibo: numeroFormatado,
                  emitente: _emitenteController.text.trim(),
                  documentoEmitente: _docEmitenteController.text.trim(),
                  pagador: _pagadorController.text.trim(),
                  documentoPagador: _docPagadorController.text.trim(),
                  valor: _valorController.text.trim(),
                  referente: _referenteController.text.trim(),
                  data: _dataAtual,
                  operador: _operadorController.text.trim(),
                  signatureBytes: signatureBytes,
                  logoBytes: _logoBytes,
                  apenasSegundaVia: false,
                );

                setState(() {
                  _pagadorController.clear();
                  _docPagadorController.clear();
                  _valorController.clear();
                  _referenteController.clear();
                  _signatureController.clear();
                });
              }
            }

            Widget _buildFormAba() {
              final numExibicao = _editingReciboIndex != null
                  ? _recibosSalvos[_editingReciboIndex!]['numero']
                  : _numeroSequencial.toString().padLeft(4, '0');

              return SingleChildScrollView(
                padding: const EdgeInsets.symmetric(horizontal: 16.0, vertical: 10.0),
                child: Form(
                  key: _formKey,
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(20.0),
                        decoration: BoxDecoration(
                          color: M3Colors.primaryDark,
                          borderRadius: BorderRadius.circular(26),
                          boxShadow: [
                            BoxShadow(
                              color: M3Colors.primaryDark.withOpacity(0.2),
                              blurRadius: 16,
                              offset: const Offset(0, 8),
                            ),
                          ],
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF1E293B),
                                    borderRadius: BorderRadius.circular(10),
                                  ),
                                  child: Row(
                                    children: const [
                                      Icon(Icons.circle, size: 7, color: M3Colors.emerald),
                                      SizedBox(width: 6),
                                      Text(
                                        "COMPROVANTE DIGITAL",
                                        style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: Colors.white, letterSpacing: 0.5),
                                      ),
                                    ],
                                  ),
                                ),
                                Text(_dataAtual, style: const TextStyle(fontSize: 12, color: Colors.white70)),
                              ],
                            ),
                            const SizedBox(height: 16),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              crossAxisAlignment: CrossAxisAlignment.end,
                              children: [
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    const Text("RECIBO Nº", style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: Colors.white38)),
                                    Text(
                                      "Nº $numExibicao",
                                      style: const TextStyle(fontSize: 28, fontWeight: FontWeight.w900, color: Colors.white),
                                    ),
                                    const SizedBox(height: 2),
                                    Text(
                                      _operadorController.text.isEmpty ? "Operador: Geral" : "Operador: ${_operadorController.text}",
                                      style: const TextStyle(fontSize: 11, color: Colors.white60),
                                    ),
                                  ],
                                ),
                                Container(
