            Widget _buildClientesAba() {
              final query = _buscaClienteController.text.toLowerCase();
              final filtrados = _clientesSalvos.where((c) {
                final nome = (c['nome'] ?? '').toString().toLowerCase();
                final doc = (c['documento'] ?? '').toString().toLowerCase();
                return nome.contains(query) || doc.contains(query);
              }).toList();

              return Scaffold(
                backgroundColor: Colors.transparent,
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: () => _abrirModalCliente(),
                  backgroundColor: M3Colors.primaryDark,
                  foregroundColor: Colors.white,
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                  icon: const Icon(Icons.person_add_rounded),
                  label: const Text("Novo Cliente", style: TextStyle(fontWeight: FontWeight.bold)),
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(16),
                      child: SearchBar(
                        controller: _buscaClienteController,
                        elevation: const WidgetStatePropertyAll(0),
                        backgroundColor: const WidgetStatePropertyAll(Colors.white),
                        hintText: 'Pesquisar cliente (A-Z) ou CPF...',
                        side: const WidgetStatePropertyAll(BorderSide(color: M3Colors.outline)),
                        shape: WidgetStatePropertyAll(RoundedRectangleBorder(borderRadius: BorderRadius.circular(16))),
                        leading: const Icon(Icons.search, color: M3Colors.primaryDark),
                        onChanged: (_) => setState(() {}),
                      ),
                    ),
                    Expanded(
                      child: filtrados.isEmpty
                          ? Center(
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  Icon(Icons.people_outline, size: 54, color: Colors.grey.shade400),
                                  const SizedBox(height: 12),
                                  const Text("Nenhum cliente cadastrado", style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: M3Colors.textMuted)),
                                ],
                              ),
