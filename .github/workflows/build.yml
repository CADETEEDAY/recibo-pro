            void _abrirModalCliente([Map<String, dynamic>? clienteExistente, int? index]) {
              final nomeCtrl = TextEditingController(text: clienteExistente?['nome'] ?? '');
              final docCtrl = TextEditingController(text: clienteExistente?['documento'] ?? '');
              final telCtrl = TextEditingController(text: clienteExistente?['telefone'] ?? '');

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(28))),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(
                    left: 20,
                    right: 20,
                    top: 20,
                    bottom: MediaQuery.of(ctx).viewInsets.bottom + 24,
                  ),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Text('Cadastrar Novo Cliente', style: Theme.of(ctx).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.bold)),
                      const SizedBox(height: 16),
                      TextField(controller: nomeCtrl, decoration: const InputDecoration(labelText: 'Nome Completo', prefixIcon: Icon(Icons.person_outline))),
                      const SizedBox(height: 12),
                      TextField(controller: docCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'CPF / CNPJ', prefixIcon: Icon(Icons.badge_outlined))),
                      const SizedBox(height: 12),
                      TextField(controller: telCtrl, keyboardType: TextInputType.phone, decoration: const InputDecoration(labelText: 'Telefone / WhatsApp', prefixIcon: Icon(Icons.phone_outlined))),
                      const SizedBox(height: 20),
                      FilledButton(
                        onPressed: () {
                          if (nomeCtrl.text.trim().isEmpty) return;
                          _clientesSalvos.add({
                            'nome': nomeCtrl.text.trim(),
                            'documento': docCtrl.text.trim(),
                            'telefone': telCtrl.text.trim(),
                          });
                          _salvarClientes();
                          Navigator.pop(ctx);
                        },
                        style: FilledButton.styleFrom(
                          backgroundColor: M3Colors.primaryDark,
                          padding: const EdgeInsets.symmetric(vertical: 16),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                        ),
                        child: const Text('Salvar Cliente', style: TextStyle(fontWeight: FontWeight.bold)),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildHistoricoAba() {
              final query = _buscaReciboController.text.toLowerCase();
              final filtrados = _recibosSalvos.where((r) {
                final nome = (r['pagador'] ?? '').toString().toLowerCase();
                final num = (r['numero'] ?? '').toString().toLowerCase();
                return nome.contains(query) || num.contains(query);
              }).toList();

              double total = 0.0;
              for (var r in _recibosSalvos) {
                final limpo = (r['valor'] ?? '0').toString().replaceAll('.', '').replaceAll(',', '.');
                total += double.tryParse(limpo) ?? 0.0;
              }

              return Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(16, 10, 16, 8),
                    child: Row(
                      children: [
                        Expanded(
                          child: Container(
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(20),
                              border: Border.all(color: M3Colors.outline),
                            ),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text("FATURAMENTO TOTAL", style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: M3Colors.textMuted)),
                                const SizedBox(height: 4),
                                Text(
                                  NumberFormat.currency(locale: 'pt_BR', symbol: 'R\$').format(total),
                                  style: const TextStyle(fontSize: 18, fontWeight: FontWeight.w900, color: M3Colors.primaryDark),
                                ),
                                const SizedBox(height: 2),
                                const Text("✓ Saldo acumulado", style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: M3Colors.emerald)),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(width: 12),
                        Expanded(
                          child: Container(
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(20),
                              border: Border.all(color: M3Colors.emerald, width: 1.2),
                            ),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text("RECIBOS EMITIDOS", style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: M3Colors.emerald)),
                                const SizedBox(height: 4),
                                Text(
                                  "${_recibosSalvos.length} emitidos",
                                  style: const TextStyle(fontSize: 18, fontWeight: FontWeight.w900, color: M3Colors.primaryDark),
                                ),
                                const SizedBox(height: 2),
                                Text("Média: R\$ ${(total / (_recibosSalvos.isEmpty ? 1 : _recibosSalvos.length)).toStringAsFixed(2)}", style: const TextStyle(fontSize: 10, color: M3Colors.textMuted)),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
                    child: SearchBar(
                      controller: _buscaReciboController,
                      elevation: const WidgetStatePropertyAll(0),
                      backgroundColor: const WidgetStatePropertyAll(Colors.white),
                      hintText: 'Pesquisar recibo ou cliente...',
                      side: const WidgetStatePropertyAll(BorderSide(color: M3Colors.outline)),
                      shape: WidgetStatePropertyAll(RoundedRectangleBorder(borderRadius: BorderRadius.circular(16))),
                      leading: const Icon(Icons.search, color: M3Colors.primaryDark),
                      onChanged: (_) => setState(() {}),
                    ),
                  ),
                  Expanded(
                    child: filtrados.isEmpty
                        ? Center(
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(Icons.receipt_long_outlined, size: 54, color: Colors.grey.shade400),
                                const SizedBox(height: 12),
                                const Text("Nenhum recibo arquivado", style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: M3Colors.textMuted)),
                              ],
