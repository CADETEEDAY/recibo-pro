              if (await canLaunchUrl(uri)) {
                await launchUrl(uri, mode: LaunchMode.externalApplication);
              }
            }

            void _abrirEmail() async {
              final uri = Uri.parse("mailto:robson.cadete@gmail.com?subject=Contato%20Recibo%20Pro");
              if (await canLaunchUrl(uri)) {
