                    NavigationDestination(icon: Icon(Icons.history_outlined), selectedIcon: Icon(Icons.history, color: ReciboColors.skyBlue), label: 'Salvos'),
                    NavigationDestination(icon: Icon(Icons.settings_outlined), selectedIcon: Icon(Icons.settings, color: ReciboColors.skyBlue), label: 'Empresa'),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Baixar dependencias
        run: flutter pub get

      - name: Compilar APK do Recibo Pro
        run: flutter build apk --release --no-tree-shake-icons

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: recibo-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
