name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Criar base nativa Android
        run: |
          flutter create --project-name recibo_pro --platforms=android --org com.recibo.pro .

      - name: Ajustar Android compileSdk 35, Kotlin e AAPT2
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle || true
          echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

      - name: Escrever pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: recibo_pro
          description: "Sistema Avancado de Recibos Digitais"
          publish_to: 'none'
          version: 2.2.0+4

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            pdf: ^3.10.8
            printing: ^5.13.1
            intl: ^0.19.0
            signature: ^5.4.1
            shared_preferences: ^2.2.3
            image_picker: ^1.1.2
            url_launcher: ^6.3.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Escrever lib/pdf_generator.dart
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/pdf_generator.dart
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';

          class PdfGenerator {
            static Future<void> gerarECompartilhar({
              required BuildContext context,
              required String numeroRecibo,
              required String emitente,
              required String documentoEmitente,
              required String pagador,
              required String documentoPagador,
              required String valor,
              required String referente,
              required String data,
              required String operador,
              Uint8List? signatureBytes,
              Uint8List? logoBytes,
              bool apenasSegundaVia = false,
            }) async {
              final pdf = pw.Document();

              pw.Widget buildViaBlock(String tagVia, {bool isReemissao = false}) {
                return pw.Container(
                  padding: const pw.EdgeInsets.all(12),
                  decoration: pw.BoxDecoration(
                    border: pw.Border.all(color: PdfColors.blueGrey800, width: 1.2),
                    borderRadius: const pw.BorderRadius.all(pw.Radius.circular(6)),
                    color: PdfColors.white,
                  ),
                  child: pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    mainAxisSize: pw.MainAxisSize.min,
                    children: [
                      // Linha Topo: Logotipo + Identificacao + Valor em Destaque
                      pw.Row(
                        crossAxisAlignment: pw.CrossAxisAlignment.center,
                        children: [
                          if (logoBytes != null)
                            pw.Container(
                              width: 50,
                              height: 50,
                              margin: const pw.EdgeInsets.only(right: 10),
                              child: pw.Image(pw.MemoryImage(logoBytes), fit: pw.BoxFit.contain),
                            ),
                          pw.Expanded(
                            child: pw.Column(
                              crossAxisAlignment: pw.CrossAxisAlignment.start,
                              children: [
                                pw.Text(
                                  emitente.isNotEmpty ? emitente.toUpperCase() : "RECIBO DE PAGAMENTO",
                                  style: pw.TextStyle(
                                    fontSize: 13,
                                    fontWeight: pw.FontWeight.bold,
                                    color: PdfColors.blueGrey900,
                                  ),
                                ),
                                if (documentoEmitente.isNotEmpty)
                                  pw.Text("CNPJ/CPF: $documentoEmitente",
                                      style: const pw.TextStyle(fontSize: 8, color: PdfColors.grey700)),
                                pw.Row(
                                  children: [
                                    pw.Text("RECIBO Nº: $numeroRecibo",
                                        style: pw.TextStyle(fontSize: 9, fontWeight: pw.FontWeight.bold, color: PdfColors.indigo900)),
                                    pw.SizedBox(width: 8),
                                    pw.Container(
                                      padding: const pw.EdgeInsets.symmetric(horizontal: 5, vertical: 1),
                                      decoration: pw.BoxDecoration(
                                        color: isReemissao ? PdfColors.amber100 : PdfColors.blueGrey50,
                                        borderRadius: const pw.BorderRadius.all(pw.Radius.circular(3)),
                                        border: pw.Border.all(color: isReemissao ? PdfColors.amber800 : PdfColors.blueGrey300, width: 0.5),
                                      ),
                                      child: pw.Text(
                                        tagVia,
                                        style: pw.TextStyle(
                                          fontSize: 7.5,
                                          fontWeight: pw.FontWeight.bold,
                                          color: isReemissao ? PdfColors.amber900 : PdfColors.blueGrey900,
                                        ),
                                      ),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                          ),
                          pw.Container(
                            padding: const pw.EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                            decoration: pw.BoxDecoration(
                              color: PdfColors.grey100,
                              border: pw.Border.all(color: PdfColors.grey400, width: 0.8),
                              borderRadius: const pw.BorderRadius.all(pw.Radius.circular(4)),
                            ),
                            child: pw.Column(
                              crossAxisAlignment: pw.CrossAxisAlignment.end,
                              children: [
                                pw.Text("VALOR TOTAL", style: const pw.TextStyle(fontSize: 7, color: PdfColors.grey700)),
                                pw.Text(
                                  "R\$ $valor",
                                  style: pw.TextStyle(
                                    fontSize: 14,
                                    fontWeight: pw.FontWeight.bold,
                                    color: PdfColors.black,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
                      pw.Divider(thickness: 0.6, height: 12),

                      // Declaracao de Quitação
                      pw.RichText(
                        text: pw.TextSpan(
                          style: const pw.TextStyle(fontSize: 9.5, lineSpacing: 1.2),
                          children: [
                            const pw.TextSpan(text: "Recebemos de "),
                            pw.TextSpan(text: pagador, style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                            const pw.TextSpan(text: ", documento CPF/CNPJ nº "),
                            pw.TextSpan(text: documentoPagador, style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                            const pw.TextSpan(text: ", a quantia líquida e certa de "),
                            pw.TextSpan(text: "R\$ $valor", style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                            const pw.TextSpan(text: " correspondente ao pagamento descrito abaixo."),
                          ],
                        ),
                      ),
                      pw.SizedBox(height: 5),

                      // Box de Referente / Descricao
                      pw.Container(
                        width: double.infinity,
                        padding: const pw.EdgeInsets.all(6),
                        decoration: pw.BoxDecoration(
                          color: PdfColors.grey50,
                          border: pw.Border.all(color: PdfColors.grey300, width: 0.5),
                          borderRadius: const pw.BorderRadius.all(pw.Radius.circular(3)),
                        ),
                        child: pw.Text(
                          "Referente: $referente",
                          style: const pw.TextStyle(fontSize: 8.5, color: PdfColors.black),
                        ),
                      ),
                      pw.SizedBox(height: 6),
                      pw.Text(
                        "Para os devidos fins de direito, firmamos e damos plena, geral e irrevogável quitação da quantia paga.",
                        style: const pw.TextStyle(fontSize: 7.5, color: PdfColors.grey700),
                      ),
                      pw.SizedBox(height: 8),

                      // Rodape: Data / Operador / Assinatura
                      pw.Row(
                        mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                        crossAxisAlignment: pw.CrossAxisAlignment.end,
                        children: [
                          pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.start,
                            children: [
                              pw.Text("Emissão: $data", style: const pw.TextStyle(fontSize: 8)),
                              if (operador.isNotEmpty)
                                pw.Text("Operador: $operador",
                                    style: pw.TextStyle(fontSize: 7.5, color: PdfColors.grey800, fontStyle: pw.FontStyle.italic)),
                            ],
                          ),
                          pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.center,
                            children: [
                              if (signatureBytes != null)
                                pw.Container(
                                  height: 32,
                                  width: 120,
                                  child: pw.Image(pw.MemoryImage(signatureBytes), fit: pw.BoxFit.contain),
                                )
                              else
                                pw.SizedBox(height: 32),
                              pw.Container(
                                width: 150,
                                decoration: const pw.BoxDecoration(
                                  border: pw.Border(bottom: pw.BorderSide(color: PdfColors.black, width: 0.7)),
                                ),
                              ),
                              pw.SizedBox(height: 2),
                              pw.Text("Assinatura do Emitente", style: const pw.TextStyle(fontSize: 7.5)),
                            ],
                          ),
                        ],
                      ),
                    ],
                  ),
                );
              }

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.symmetric(horizontal: 20, vertical: 16),
                  build: (pw.Context context) {
                    if (apenasSegundaVia) {
                      return pw.Column(
                        children: [
                          buildViaBlock("2ª VIA - VIA DA EMPRESA (REEMISSÃO)", isReemissao: true),
                          pw.Padding(
                            padding: const pw.EdgeInsets.symmetric(vertical: 10),
                            child: pw.Row(
                              mainAxisAlignment: pw.MainAxisAlignment.center,
                              children: [
                                pw.Text("--- 2ª VIA EMITIDA PARA COMPROVAÇÃO E ARQUIVO ---",
                                    style: const pw.TextStyle(fontSize: 8, color: PdfColors.grey600)),
                              ],
                            ),
                          ),
                          buildViaBlock("2ª VIA - VIA DO CLIENTE (REEMISSÃO)", isReemissao: true),
                        ],
                      );
                    }

                    return pw.Column(
                      children: [
                        buildViaBlock("1ª VIA - CLIENTE"),
                        pw.Padding(
                          padding: const pw.EdgeInsets.symmetric(vertical: 10),
                          child: pw.Row(
                            mainAxisAlignment: pw.MainAxisAlignment.center,
                            children: [
                              pw.Text(
                                "- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -",
                                style: const pw.TextStyle(color: PdfColors.grey500, fontSize: 6),
                              ),
                            ],
                          ),
                        ),
                        buildViaBlock("2ª VIA - EMPRESA"),
                      ],
                    );
                  },
                ),
              );

              await Printing.layoutPdf(
                onLayout: (PdfPageFormat format) async => pdf.save(),
                name: 'recibo_${numeroRecibo}_${apenasSegundaVia ? "2via" : "completo"}.pdf',
              );
            }
          }
          EOF

      - name: Escrever lib/main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:intl/intl.dart';
          import 'package:signature/signature.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'pdf_generator.dart';

          void main() => runApp(const ReciboProApp());

          class ReciboProApp extends StatelessWidget {
            const ReciboProApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Recibo Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.indigo,
                  scaffoldBackgroundColor: const Color(0xFFF8FAFC),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Colors.indigo,
                    foregroundColor: Colors.white,
                    elevation: 0,
                    centerTitle: true,
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: Colors.white,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(12),
                      borderSide: const BorderSide(color: Color(0xFFE2E8F0)),
                    ),
                    enabledBorder: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(12),
                      borderSide: const BorderSide(color: Color(0xFFCBD5E1)),
                    ),
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int _currentIndex = 0;
            final _formKey = GlobalKey<FormState>();

            final _operadorController = TextEditingController();
            final _emitenteController = TextEditingController();
            final _docEmitenteController = TextEditingController();
            final _pagadorController = TextEditingController();
            final _docPagadorController = TextEditingController();
            final _valorController = TextEditingController();
            final _referenteController = TextEditingController();

            final _buscaReciboController = TextEditingController();
            final _buscaClienteController = TextEditingController();

            late SignatureController _signatureController;
            String _dataAtual = '';
            int _numeroSequencial = 1;
            Uint8List? _logoBytes;

            List<Map<String, dynamic>> _recibosSalvos = [];
            List<Map<String, dynamic>> _clientesSalvos = [];
            int? _editingReciboIndex;

            @override
            void initState() {
              super.initState();
              _dataAtual = DateFormat('dd/MM/yyyy').format(DateTime.now());
              _signatureController = SignatureController(
                penStrokeWidth: 3,
                penColor: Colors.indigo.shade900,
                exportBackgroundColor: Colors.transparent,
              );
              _carregarConfiguracoes();
              _carregarRecibos();
              _carregarClientes();
            }

            @override
            void dispose() {
              _signatureController.dispose();
              super.dispose();
            }

            Future<void> _carregarConfiguracoes() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _operadorController.text = prefs.getString('ultimo_operador') ?? '';
                _emitenteController.text = prefs.getString('empresa_nome') ?? '';
                _docEmitenteController.text = prefs.getString('empresa_doc') ?? '';
                _numeroSequencial = prefs.getInt('recibo_sequencial') ?? 1;
                final logoBase64 = prefs.getString('empresa_logo');
                if (logoBase64 != null) {
                  _logoBytes = base64Decode(logoBase64);
                }
              });
            }

            Future<void> _salvarConfiguracoes() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('ultimo_operador', _operadorController.text);
              await prefs.setString('empresa_nome', _emitenteController.text);
              await prefs.setString('empresa_doc', _docEmitenteController.text);
              await prefs.setInt('recibo_sequencial', _numeroSequencial);
              if (_logoBytes != null) {
                await prefs.setString('empresa_logo', base64Encode(_logoBytes!));
              }
            }

            Future<void> _zerarNumeracao() async {
              final confirm = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Zerar Numeração?'),
                  content: const Text('O próximo recibo será reiniciado para 0001. Confirma?'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Cancelar')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.red, foregroundColor: Colors.white),
                      onPressed: () => Navigator.pop(ctx, true),
                      child: const Text('Confirmar e Zerar'),
                    ),
                  ],
                ),
              );

              if (confirm == true) {
                final prefs = await SharedPreferences.getInstance();
                setState(() {
                  _numeroSequencial = 1;
                });
                await prefs.setInt('recibo_sequencial', 1);
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Numeração zerada para 0001!')));
              }
            }

            Future<void> _selecionarLogo() async {
              final picker = ImagePicker();
              final picked = await picker.pickImage(source: ImageSource.gallery);
              if (picked != null) {
                final bytes = await picked.readAsBytes();
                setState(() {
                  _logoBytes = bytes;
                });
                _salvarConfiguracoes();
              }
            }

            Future<void> _carregarRecibos() async {
              final prefs = await SharedPreferences.getInstance();
              final raw = prefs.getString('historico_recibos');
              if (raw != null) {
                final List decoded = jsonDecode(raw);
                setState(() {
                  _recibosSalvos = decoded.cast<Map<String, dynamic>>();
                });
              }
            }

            Future<void> _carregarClientes() async {
              final prefs = await SharedPreferences.getInstance();
              final raw = prefs.getString('lista_clientes');
              if (raw != null) {
                final List decoded = jsonDecode(raw);
                setState(() {
                  _clientesSalvos = decoded.cast<Map<String, dynamic>>();
                  _ordenarClientes();
                });
              }
            }

            void _ordenarClientes() {
              _clientesSalvos.sort((a, b) => (a['nome'] as String).toLowerCase().compareTo((b['nome'] as String).toLowerCase()));
            }

            Future<void> _salvarClientes() async {
              final prefs = await SharedPreferences.getInstance();
              _ordenarClientes();
              await prefs.setString('lista_clientes', jsonEncode(_clientesSalvos));
              setState(() {});
            }

            void _adicionarOuEditarCliente([Map<String, dynamic>? clienteExistente, int? index]) {
              final nomeCtrl = TextEditingController(text: clienteExistente?['nome'] ?? '');
              final docCtrl = TextEditingController(text: clienteExistente?['documento'] ?? '');
              final telCtrl = TextEditingController(text: clienteExistente?['telefone'] ?? '');

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text(clienteExistente == null ? 'Cadastrar Cliente' : 'Editar Cliente'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(controller: nomeCtrl, decoration: const InputDecoration(labelText: 'Nome Completo')),
                        const SizedBox(height: 10),
                        TextField(controller: docCtrl, decoration: const InputDecoration(labelText: 'CPF / CNPJ'), keyboardType: TextInputType.number),
                        const SizedBox(height: 10),
                        TextField(controller: telCtrl, decoration: const InputDecoration(labelText: 'Telefone / WhatsApp'), keyboardType: TextInputType.phone),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancelar')),
                    ElevatedButton(
                      onPressed: () {
                        if (nomeCtrl.text.trim().isEmpty) return;
                        final dados = {
                          'nome': nomeCtrl.text.trim(),
                          'documento': docCtrl.text.trim(),
                          'telefone': telCtrl.text.trim(),
                        };
                        if (clienteExistente == null) {
                          _clientesSalvos.add(dados);
                        } else if (index != null) {
                          _clientesSalvos[index] = dados;
                        }
                        _salvarClientes();
                        Navigator.pop(ctx);
                      },
                      child: const Text('Salvar'),
                    ),
                  ],
                ),
              );
            }

            void _preencherReciboComCliente(Map<String, dynamic> cliente) {
              setState(() {
                _pagadorController.text = cliente['nome'] ?? '';
                _docPagadorController.text = cliente['documento'] ?? '';
                _currentIndex = 0;
              });
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text("Cliente ${cliente['nome']} selecionado!")),
              );
            }

            void _carregarReciboParaEdicao(int index) {
              final r = _recibosSalvos[index];
              setState(() {
                _editingReciboIndex = index;
                _pagadorController.text = r['pagador'] ?? '';
                _docPagadorController.text = r['docPagador'] ?? '';
                _valorController.text = r['valor'] ?? '';
                _referenteController.text = r['referente'] ?? '';
                if (r['operador'] != null) _operadorController.text = r['operador'];
                _currentIndex = 0;
              });
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text("Editando Recibo Nº ${r['numero']}")),
              );
            }

            Future<void> _emitirRecibo() async {
              if (_formKey.currentState!.validate()) {
                if (_operadorController.text.trim().isEmpty) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Por favor, informe o Nome do Operador!'), backgroundColor: Colors.red),
                  );
                  return;
                }

                Uint8List? signatureBytes;
                if (_signatureController.isNotEmpty) {
                  signatureBytes = await _signatureController.toPngBytes();
                }

                final numeroFormatado = _editingReciboIndex != null
                    ? _recibosSalvos[_editingReciboIndex!]['numero']
                    : _numeroSequencial.toString().padLeft(4, '0');

                final dadosRecibo = {
                  'numero': numeroFormatado,
                  'data': _dataAtual,
                  'operador': _operadorController.text.trim(),
                  'emitente': _emitenteController.text.trim(),
                  'docEmitente': _docEmitenteController.text.trim(),
                  'pagador': _pagadorController.text.trim(),
                  'docPagador': _docPagadorController.text.trim(),
                  'valor': _valorController.text.trim(),
                  'referente': _referenteController.text.trim(),
                  'assinatura': signatureBytes != null ? base64Encode(signatureBytes) : null,
                };

                final prefs = await SharedPreferences.getInstance();

                if (_editingReciboIndex != null) {
                  _recibosSalvos[_editingReciboIndex!] = dadosRecibo;
                  _editingReciboIndex = null;
                } else {
                  _recibosSalvos.insert(0, dadosRecibo);
                  _numeroSequencial++;
                  await prefs.setInt('recibo_sequencial', _numeroSequencial);
                }

                await prefs.setString('historico_recibos', jsonEncode(_recibosSalvos));
                await _salvarConfiguracoes();

                if (!mounted) return;

                await PdfGenerator.gerarECompartilhar(
                  context: context,
                  numeroRecibo: numeroFormatado,
                  emitente: _emitenteController.text.trim(),
                  documentoEmitente: _docEmitenteController.text.trim(),
                  pagador: _pagadorController.text.trim(),
                  documentoPagador: _docPagadorController.text.trim(),
                  valor: _valorController.text.trim(),
                  referente: _referenteController.text.trim(),
                  data: _dataAtual,
                  operador: _operadorController.text.trim(),
                  signatureBytes: signatureBytes,
                  logoBytes: _logoBytes,
                  apenasSegundaVia: false,
                );

                setState(() {
                  _pagadorController.clear();
                  _docPagadorController.clear();
                  _valorController.clear();
                  _referenteController.clear();
                  _signatureController.clear();
                });
              }
            }

            void _imprimirSegundaVia(Map<String, dynamic> r) {
              Uint8List? sig;
              if (r['assinatura'] != null) {
                sig = base64Decode(r['assinatura']);
              }
              PdfGenerator.gerarECompartilhar(
                context: context,
                numeroRecibo: r['numero'],
                emitente: r['emitente'] ?? _emitenteController.text,
                documentoEmitente: r['docEmitente'] ?? _docEmitenteController.text,
                pagador: r['pagador'],
                documentoPagador: r['docPagador'],
                valor: r['valor'],
