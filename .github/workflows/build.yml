name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Salvar arquivos do Recibo
        run: |
          mkdir -p /tmp/recibo_backup
          cp -r lib /tmp/recibo_backup/
          cp pubspec.yaml /tmp/recibo_backup/

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Gerar estrutura nativa Android
        run: |
          flutter create --project-name recibo_pro --platforms=android --org com.recibo.pro .

      - name: Restaurar arquivos do Recibo Pro
        run: |
          cp -rf /tmp/recibo_backup/lib .
          cp -f /tmp/recibo_backup/pubspec.yaml .

      - name: Baixar dependencias
        run: flutter pub get

      - name: Compilar APK do Recibo Pro
        run: flutter build apk --release --no-tree-shake-icons

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: recibo-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
